[worldflip]
; Master enable. If 0 the DLL is pure pass-through (zero overhead).
enabled = 1

; Toggle hotkey (virtual-key code, hex). Default = F11 (0x7A).
; Common:  0x7A=F11, 0x7B=F12, 0x2D=Insert, 0x76=F7, 0x78=F9
toggle_vk = 0x7A

; Show an on-screen debug banner (reserved, not yet rendered).
debug_banner = 0

; Write cod4-worldflip.log next to iw3mp.exe.
log = 1
